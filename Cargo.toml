[package]
name = "vyges-sdc"
version = "0.1.55"
edition = "2021"
description = "Loom engine: SDC constraint checking (completeness + consistency) and writing, over the vyges-loom SDC model"
repository = "https://github.com/vyges-tools/sdc"
homepage = "https://vyges.com"
license = "Apache-2.0"

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []

[[bin]]
name = "vyges-sdc"
path = "src/main.rs"

[dependencies]
# The SDC reader, the writer and the linter all live in loom; this engine is their command
# line. `gzip`: netlists and Liberty files are read gzipped as well as plain.
vyges-loom = { git = "https://github.com/vyges-tools/loom", branch = "main", features = ["gzip"] }
# serde_json frames the --describe contract and the --json result envelope.
serde_json = "1"
# Structured logging: summary events to stderr.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

[profile.release]
strip = true
